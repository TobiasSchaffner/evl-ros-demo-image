#
# ISAR ROS Xenomai Image - Distro Configuration
#
# Ubuntu 26.04 (Resolute Raccoon) + Xenomai 4 (EVL) + ROS 2 Lyrical.
#
# Resolute is the release packages.ros.org builds Lyrical for.
#
# SPDX-License-Identifier: MIT
#

# Keep DISTRO_ARCH defined even if machine/local config is regenerated.
DISTRO_ARCH ?= "amd64"

require conf/distro/ubuntu-resolute.conf
HOST_DISTRO = "ubuntu-resolute"
DISTRO_APT_SOURCES:append = " conf/distro/ros2-resolute.list"
THIRD_PARTY_APT_KEYS += "https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc;sha256sum=490a879375bd4f3dfbe1483efbf8db8985e2ad66b7a19baee0087b333c67caf0"

# ROS 2 release shipped for resolute
ROS_DISTRO ?= "lyrical"

# Used for the Maintainer field of every package this layer builds
MAINTAINER ?= "Tobias Schaffner <tobias.schaffner@hm.edu>"

XENOMAI_MAJOR_VERSION = "4"
OVERRIDES .= ":xenomai${XENOMAI_MAJOR_VERSION}"

# EVL ABI 45 across the board: kernel v6.18.x-evl5, libevl r59, evl-sys 0.36.1
PREFERRED_VERSION_linux-xenomai-4 = "6.18%"
PREFERRED_VERSION_libevl = "59"

# The BBCLASSEXTEND variants carry their own PN, so the preference above does
# not reach them. Without this they resolve to the AUTOREV "latest" recipe and
# a second kernel gets built alongside the pinned one.
PREFERRED_VERSION_linux-xenomai-4-native = "6.18%"
PREFERRED_VERSION_linux-xenomai-4-kbuildtarget = "6.18%"
PREFERRED_VERSION_linux-xenomai-4-libctarget = "6.18%"

# Hard assignment: ubuntu-common.inc sets KERNEL_NAME = "generic", so a
# weak assignment here would silently leave the stock Ubuntu kernel in the
# image instead of the EVL one.
KERNEL_NAME = "xenomai-4"
SDK_INSTALL += "linux-headers-${KERNEL_NAME}"
SDK_INSTALL += "libevl"

# isar defaults to an EFI/GRUB image layout, which a Pi does not boot.
# xenomai-images ships a partition layout per machine in its wic/ directory.
WKS_FILE = "${MACHINE}.wks"

# The rpi4 machine config in xenomai-images asks for Debian's
# firmware-brcm80211. Ubuntu has no such package; it splits the firmware per
# vendor, and the Pi 4's BCM43455 lives in linux-firmware-broadcom-wireless.
# (The linux-firmware metapackage would pull in every vendor, ~600 MB.)
IMAGE_PREINSTALL:remove = "firmware-brcm80211"
IMAGE_PREINSTALL:append:rpi4 = " linux-firmware-broadcom-wireless"

# Debian creates a /vmlinuz symlink at the root of the rootfs, which is what
# the rpi4 machine config feeds to the boot partition. Ubuntu keeps the kernel
# symlinks in /boot, so point wic at the one that exists here.
IMAGE_BOOT_FILES:remove = "${IMAGE_ROOTFS}/vmlinuz;kernel8.img"
IMAGE_BOOT_FILES:append:rpi4 = " ${IMAGE_ROOTFS}/boot/vmlinuz;kernel8.img"
